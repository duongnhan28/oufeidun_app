name: AppBanHang CI and LOCAL release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CI: 'true'
      VITE_GLASS_LOOKUP_API_URL: https://oufeidun.vn/api/glass-lookup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Validate version and release notes
        run: node scripts/release/ci.cjs guard
      - name: Install locked dependencies
        run: npm ci
      - name: Install dependencies needed by pure server date unit test
        run: npm ci --prefix server --ignore-scripts
      - name: Test release safety
        run: node --test scripts/release/release.test.cjs
      - name: Unit tests with isolated server configuration
        timeout-minutes: 5
        env:
          MYSQL_USER: ci-unused
          MYSQL_PASSWORD: ci-no-database-connection
          OUFEIDUN_SERVER_ENV: ${{ runner.temp }}/unit-test-no-server.env
          OUFEIDUN_DATA_DIR: ${{ runner.temp }}/unit-test-server-data
        run: npm run test
      - name: UI tests with disposable demo database
        timeout-minutes: 15
        env:
          VITE_DEMO_MODE: 'true'
          VITE_SERVER_ENV: test
        run: npm run test:ui
      - name: Electron smoke with disposable demo database
        timeout-minutes: 4
        env:
          VITE_DEMO_MODE: 'true'
          VITE_SERVER_ENV: test
        run: npm run test:electron
      - name: Typecheck and default build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Generate public LOCAL profile
        run: node scripts/release/ci.cjs local-env
      - name: Build LOCAL Windows installer
        run: npm run make:local
      - name: Audit packaged LOCAL app
        run: node scripts/audit-local-package.cjs
      - name: Smoke packaged app with isolated user data
        run: node scripts/smoke-electron.cjs --packaged --production
      - name: Stage installer and proof
        run: node scripts/release/ci.cjs stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-installer
          path: .local/ci-artifact/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: app-production
    concurrency:
      group: app-local-stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: local-installer
          path: .local/ci-artifact
      - name: Verify artifact proof and tag ancestry
        run: |
          node scripts/release/ci.cjs guard
          node scripts/release/ci.cjs verify .local/ci-artifact
      - name: Sign update manifest with existing identity
        env:
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: |
          version=$(node -p 'require("./package.json").version')
          node scripts/publish-client-update.cjs prepare .local/ci-artifact/Oufeidun-Setup.exe "$version" local-mysql "docs/releases/$version.md" ENV:APP_UPDATE_SIGNING_KEY .local/signed
      - name: Retain small signed preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-local-manifest
          path: .local/signed/stable/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Publish tagged release to hosting
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: node scripts/release/publish.cjs
      - name: Explain build-only run
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: echo 'Build and signing verified. No hosting upload; current client feed unchanged.' >> "$GITHUB_STEP_SUMMARY"
